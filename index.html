<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ashen Covenant">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161313">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Ashen Covenant</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Silkscreen:wght@400;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout (TFT-style, portrait): round track + HP / trait badges / battlefield / bench / level-gold-fight bar / XP+reroll + shop cards. Unit and trait cards rise as a bottom sheet. */
:root{
  --ground:#161313; --panel:#221d1c; --panel-2:#2c2524; --line:#433836;
  --gold:#c9a25a; --bone:#e8dfcf; --muted:#a39890;
  --ally:#6b9ac4; --foe:#c4564a; --good:#7dbb7a; --mana:#7fa8e0;
  --c1:#8a8580; --c2:#5f9a5f; --c3:#4f86c6; --c4:#a86ad0; --c5:#d8ab4c;
  --bronze:#9a6a3e; --silver:#aab4be; --goldt:#d8ab4c;
  --display:"IM Fell English SC", Georgia, serif;
  --body:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
body{background:var(--ground);color:var(--bone);font-family:var(--body);font-size:14px;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:6px 12px;display:flex;flex-direction:column;gap:6px;box-sizing:border-box}
button{font-family:var(--body);color:var(--bone);cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
#top{display:flex;align-items:center;gap:10px}
#roundBox{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#roundLbl{font-family:var(--display);font-size:16px;color:var(--gold);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#roundLbl small{font-family:var(--body);color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
#pips{display:flex;gap:3px;align-items:center}
.pip{width:9px;height:6px;background:var(--panel-2);border-radius:1px}
.pip.done{background:#5c4a32} .pip.lost{background:#5a2622}
.pip.cur{background:var(--gold)}
.pip.elite,.pip.boss{width:8px;height:8px;transform:rotate(45deg);border-radius:1px}
.pip.boss{width:10px;height:10px;background:#5a1e18;box-shadow:0 0 0 1px var(--foe)}
.pip.boss.cur{background:var(--foe)}
#hpBox{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 9px}
#hpBox .heart{width:12px;height:12px;background:var(--foe);clip-path:polygon(50% 100%,0 40%,10% 10%,30% 0,50% 18%,70% 0,90% 10%,100% 40%)}
#hpBox b{font-size:17px}
.flash{animation:flash .6s}
@keyframes flash{0%,100%{transform:none}30%{transform:scale(1.25)}}

/* traits */
#traits{display:flex;gap:5px;overflow-x:auto;min-height:30px;scrollbar-width:none;align-items:center}
#traits::-webkit-scrollbar{display:none}
.tb{flex:none;display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 8px 2px 3px;font-size:12px;font-weight:600;color:var(--muted)}
.hexi{width:22px;height:24px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#3a3230;display:grid;place-items:center;font-size:11px;font-weight:700;color:#1a1414}
.hexi i{width:16px;height:18px;clip-path:inherit;display:grid;place-items:center;font-style:normal;color:var(--bone);background:#2a2422}
.tb.t1 .hexi{background:var(--bronze)} .tb.t2 .hexi{background:var(--silver)} .tb.t3 .hexi{background:var(--goldt)}
.tb.on{color:var(--bone)}
.tb .cnt{color:var(--muted);font-weight:500}
.tb.on .cnt b{color:var(--bone)}
.traitEmpty{font-size:12px;color:var(--muted)}

/* stage */
#stage{position:relative;margin-inline:-16px;border-block:1px solid var(--line)}
#cv{display:block;width:100%}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#120e0ee6;border:1px solid var(--line);border-radius:4px;padding:5px 12px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;max-width:86%;font-size:13px;line-height:1.3}
#toast.show{opacity:1}
#toast b{display:block}
#toast span{color:var(--muted);font-size:12px}

/* bench */
#bench{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.slot{aspect-ratio:1/1.15;background:var(--panel);border-radius:3px;border:1px solid #2e2726;position:relative;box-sizing:border-box;overflow:hidden}
.slot.sel{border-color:var(--gold);background:var(--panel-2)}
.slot.drop{border-color:#5a4a32}
.pc{display:block;width:100%;height:100%}
.pstars{position:absolute;top:1px;left:0;right:0;text-align:center;color:var(--gold);font-size:8px;line-height:1;text-shadow:0 1px 2px #000}
.slot.k1{box-shadow:inset 0 -2px 0 var(--c1)} .slot.k2{box-shadow:inset 0 -2px 0 var(--c2)} .slot.k3{box-shadow:inset 0 -2px 0 var(--c3)} .slot.k4{box-shadow:inset 0 -2px 0 var(--c4)}

/* econ bar */
#econ{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px}
#lvlBox{display:flex;flex-direction:column;gap:3px;min-width:0}
#lvlBox .row{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted)}
#lvlBox .row b{font-size:15px;color:var(--bone)}
#xpbar{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden}
#xpbar i{display:block;height:100%;background:#6a9ad0;width:0}
#odds{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
#odds span{display:inline-block;margin-right:3px}
#lvlBox{overflow:hidden}
#goldBox{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700;color:var(--gold)}
.coin{display:inline-block;vertical-align:middle;flex:none;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f2d58a,#b88a30 60%,#7a5a1e);box-shadow:inset 0 0 0 1.5px #6a4a18}
#fight{justify-self:end;background:#7a2e1c;border:1px solid #c0603a;border-radius:4px;padding:9px 16px;font-family:var(--display);font-size:18px;min-width:96px}
#fight:disabled{opacity:.5}

/* shop */
#shopRow{display:grid;grid-template-columns:58px 1fr;gap:5px;position:relative}
#selbar{position:absolute;inset:0;z-index:3;background:#1c1817;border:1px solid var(--gold);border-radius:6px;display:flex;align-items:center;gap:10px;padding:8px 10px;box-sizing:border-box}
#selbar .sp{width:56px;height:68px;flex:none;border-radius:4px;border:2px solid var(--c1);background:radial-gradient(circle at 50% 70%,#3a2e2a,#1b1615);overflow:hidden}
#selbar .sp.k2{border-color:var(--c2)} #selbar .sp.k3{border-color:var(--c3)} #selbar .sp.k4{border-color:var(--c4)}
#selbar .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
#selbar .nm{font-family:var(--display);font-size:18px;line-height:1}
#selbar .nm span{color:var(--gold);font-family:var(--body);font-size:12px;margin-left:3px}
#selbar .hint{font-size:11px;color:var(--muted)}
#selbar .ab{font-size:11.5px;line-height:1.3;color:var(--bone);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#selbar .ab span{color:var(--mana)}
.card .ci{position:absolute;right:3px;bottom:21px;width:18px;height:18px;border-radius:50%;background:#120e0ed9;border:1px solid var(--line);font:italic 700 11px/16px Georgia,serif;color:var(--bone);text-align:center;z-index:2}
#selbar .btns{display:flex;flex-direction:column;gap:5px;flex:none}
#selbar .btns button{border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:7px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;justify-content:center}
#selbar .btns .sell{background:#4a2420;border-color:var(--foe)}
#shopBtns{display:flex;flex-direction:column;gap:5px}
.sbtn{flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:4px;font-weight:700;font-size:12.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px}
.sbtn small{display:flex;align-items:center;gap:3px;color:var(--gold);font-size:12px}
.sbtn small .coin{width:10px;height:10px}
.sbtn:disabled{opacity:.4}
#shop{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.card{position:relative;height:120px;border-radius:4px;border:2px solid var(--c1);background:#1d1817;overflow:hidden;padding:0;min-width:0}
.card .art{position:absolute;inset:0 0 18px 0;background:radial-gradient(circle at 50% 70%,#3a2e2a,#1b1615)}
.card .pc{position:absolute;inset:0}
.card .trs{position:absolute;left:3px;top:3px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.card .trs span{font-size:8.5px;max-width:100%;font-weight:600;background:#120e0ecc;border-radius:2px;padding:0 3px;line-height:13px;display:flex;align-items:center;gap:3px}
.card .trs span i{width:5px;height:5px;border-radius:50%;display:block}
.card .foot{position:absolute;left:0;right:0;bottom:0;height:18px;background:#120e0e;display:flex;align-items:center;justify-content:space-between;gap:2px;padding:0 3px;font-size:10.5px;font-weight:700;letter-spacing:-.01em}
.card .foot .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .foot .cst{display:flex;align-items:center;gap:1px;color:var(--gold);flex:none}
.card .foot .cst .coin{width:9px;height:9px}
.card.k2{border-color:var(--c2)} .card.k3{border-color:var(--c3)} .card.k4{border-color:var(--c4)}
.card.empty{opacity:.2;border-color:var(--line)}
.card.poor{filter:grayscale(.7) brightness(.6)}
.card.pair::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 14px rgba(201,162,90,.5);pointer-events:none}

/* bottom sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;pointer-events:none}
#sheet .in{pointer-events:auto;width:100%;max-width:520px;max-height:48vh;overflow-y:auto;background:#1c1817;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:9px;box-shadow:0 -10px 30px #000a}
.sh-head{display:flex;gap:10px;align-items:flex-start}
.sh-port{width:62px;height:72px;flex:none;border-radius:4px;border:2px solid var(--c1);background:radial-gradient(circle at 50% 70%,#3a2e2a,#1b1615);overflow:hidden}
.sh-port.k2{border-color:var(--c2)} .sh-port.k3{border-color:var(--c3)} .sh-port.k4{border-color:var(--c4)} .sh-port.k5{border-color:var(--foe)}
.sh-id{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sh-name{font-family:var(--display);font-size:20px;line-height:1.05;color:var(--bone)}
.sh-name .st{color:var(--gold);font-family:var(--body);font-size:13px;margin-left:4px}
.sh-title{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:3px;padding:1px 6px;display:flex;align-items:center;gap:4px;background:var(--panel)}
.chip i{width:6px;height:6px;border-radius:50%}
.sh-x{flex:none;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;width:30px;height:30px;font-size:15px;line-height:1}
.bars2{display:flex;flex-direction:column;gap:3px}
.bar2{position:relative;height:14px;background:#0e0b0b;border-radius:2px;overflow:hidden}
.bar2 i{position:absolute;inset:0 auto 0 0;background:var(--good)}
.bar2.mp{height:9px} .bar2.mp i{background:var(--mana)}
.bar2.foe i{background:var(--foe)}
.bar2 span{position:relative;font-size:10.5px;font-weight:700;display:block;text-align:center;line-height:14px;text-shadow:0 1px 2px #000}
.bar2.mp span{line-height:9px;font-size:8.5px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.sgrid div{background:var(--panel);border-radius:3px;padding:4px 7px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sgrid b{color:var(--bone)}
.abil{background:var(--panel);border-radius:4px;padding:7px 9px;font-size:12.5px;line-height:1.35;color:var(--muted)}
.abil .h{display:flex;justify-content:space-between;color:var(--bone);font-weight:700;margin-bottom:2px}
.abil .h span{color:var(--mana);font-weight:600;font-size:11.5px}
.sh-act{display:flex;gap:6px}
.sh-act button{flex:1;border-radius:4px;padding:9px;font-weight:700;border:1px solid var(--line);background:var(--panel-2)}
.sh-act .sell{background:#4a2420;border-color:var(--foe)}
.tiers{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.tiers div{display:flex;gap:8px}
.tiers b{width:18px;flex:none;color:var(--muted)}
.tiers .on{color:var(--bone)} .tiers .on b{color:var(--gold)}
.tunits{display:flex;flex-wrap:wrap;gap:4px}
.tunit{width:44px;height:52px;border-radius:3px;border:1.5px solid var(--c1);background:#1b1615;position:relative;overflow:hidden;opacity:.4}
.tunit.own{opacity:1}
.tunit.k2{border-color:var(--c2)} .tunit.k3{border-color:var(--c3)} .tunit.k4{border-color:var(--c4)}

/* modal */
#overlay{position:fixed;inset:0;background:#0b0909d9;display:grid;place-items:center;padding:16px;z-index:10;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 16px;max-width:400px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:11px}
.modal .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.modal h2{font-family:var(--display);font-weight:400;color:var(--gold);margin:0;font-size:27px;line-height:1.05;text-wrap:balance}
.modal p{margin:0;color:var(--muted);line-height:1.45}
.modal p em{color:var(--bone)}
.aug{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:8px 12px}
.aug b{display:block;font-size:15px;margin-bottom:1px}
.aug span{color:var(--muted)}
.aug.on{border-color:var(--gold);background:#3a2f22}
.btn.go{background:#7a2e1c;border:1px solid #c0603a;border-radius:4px;padding:11px;font-family:var(--display);font-size:19px}
.btn.go:disabled{opacity:.4}
.slot.k5{box-shadow:inset 0 -2px 0 var(--c5)} .card.k5{border-color:var(--c5)} .tunit.k5{border-color:var(--c5)} .sh-port.k5,#selbar .sp.k5{border-color:var(--c5)}
#mapBtn{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 11px;font-weight:700;font-size:12.5px;letter-spacing:.04em}
.pip.round{border-radius:50%;width:7px;height:7px}
#mapv{position:fixed;inset:0;z-index:9;background:radial-gradient(120% 70% at 50% 0%,#2e1e19,#141011 70%);overflow:hidden}
#mapv .mv{max-width:520px;height:100%;box-sizing:border-box;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:7px}
#mvWrap{flex:1;min-height:0;position:relative}
.mv-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mv-head h2{font-family:var(--display);font-weight:400;color:var(--gold);margin:2px 0 0;font-size:26px;line-height:1}
.mv-head p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
#mvSvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mv-hint{margin:0;color:var(--bone);font-size:13px;text-align:center}
.mv-legend{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11px;color:var(--muted);justify-content:center}
.mv-legend span{display:flex;align-items:center;gap:3px}
.node.avail{cursor:pointer}
.node.avail .ring{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.2}}
.aug:disabled{opacity:.42}
.aug .price{float:right;color:var(--gold);display:flex;align-items:center;gap:4px}
.aug .price .coin{width:12px;height:12px}
/* trait badges: origins are big hexagons, classes are small roundels; the badge fills with the trait colour once active */
.tb{border-color:#3a3230;padding:2px 9px 2px 3px;gap:6px}
.tbadge{display:grid;place-items:center;flex:none;background:#2c2624}
.tb.origin .tbadge{width:27px;height:30px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.tb.class .tbadge{width:21px;height:21px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #4a403c}
.tb.class{font-size:11px;font-weight:600}
.tb.origin .tn{font-family:var(--display);font-size:14px;font-weight:400;letter-spacing:.01em}
.tbadge .tic{width:15px;height:15px;opacity:.55}
.tb.class .tbadge .tic{width:12px;height:12px}
.tb.on{color:var(--bone);background:var(--panel);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 26%,#221d1c),#221d1c 85%)}
.tb.on .tbadge{background:var(--tc)}
.tb.on .tbadge .tic{color:#1a1210!important;opacity:1}
.tb.t1{border-color:var(--bronze)} .tb.t2{border-color:var(--silver)}
.tb.t3{border-color:var(--goldt);box-shadow:0 0 10px rgba(216,171,76,.45)}
.tb.class.on .tbadge{box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.35)}
.tb.big{display:inline-flex;border:0;background:none;padding:0}
.tb.big.origin .tbadge{width:40px;height:45px}.tb.big.class .tbadge{width:36px;height:36px}
.tb.big .tbadge .tic{width:22px;height:22px}
.chip .tic{width:12px;height:12px;flex:none}
.card .trs .tic{width:10px;height:10px;flex:none}
#sfxBtn{background:var(--panel);border:1px solid var(--line);border-radius:4px;width:32px;height:30px;display:grid;place-items:center;color:var(--bone);padding:0}
#goldBox{flex-direction:column;gap:2px;position:relative;font-size:20px}
#goldBox .gtop{display:flex;align-items:center;gap:6px}
#goldSub{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.ipips{display:flex;gap:2px}.ipips i{width:5px;height:7px;background:#3a3230;border-radius:1px}.ipips i.on{background:var(--gold);box-shadow:0 0 4px rgba(216,171,76,.7)}
.stk.w{color:#ff9a4a}.stk.l{color:#7fa8e0}
.gfloat{position:absolute;left:50%;top:-8px;transform:translateX(-50%);color:#ffd36a;font-weight:700;font-size:15px;pointer-events:none;animation:gf 1.1s ease-out forwards;text-shadow:0 1px 2px #000}
@keyframes gf{to{transform:translate(-50%,-28px);opacity:0}}
#lvlBox.lvlup{animation:lvl .9s}
@keyframes lvl{25%{transform:scale(1.06);filter:brightness(1.8)}}
.slot.pop{animation:spop .9s ease-out;border-color:var(--gold)}
@keyframes spop{0%{transform:scale(1.4);box-shadow:0 0 0 2px var(--gold),0 0 24px rgba(255,210,110,.95)}100%{transform:none}}
.card.deal{animation:deal .4s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d)}
@keyframes deal{from{transform:translateY(16px) scale(.85);opacity:0}}
.card.k4::before,.card.k5::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.28) 50%,transparent 62%);background-size:260% 100%;animation:shine 2.8s linear infinite}
.card.k5{box-shadow:0 0 12px rgba(216,171,76,.45)}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}
#banner{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:radial-gradient(circle at 50% 45%,rgba(24,10,12,.5),rgba(10,6,6,.86));animation:bin .3s ease-out}

/* ===================== v0.19 visual pass ===================== */
:root{--panel-g:linear-gradient(180deg,#2a2321,#1d1817);--edge:#4a3c36;--hi:inset 0 1px 0 rgba(255,236,200,.06);--drop:0 2px 8px rgba(0,0,0,.45);--ember:linear-gradient(180deg,#a8441e,#7a2a14 55%,#5e1e0e)}
body{background:radial-gradient(120% 60% at 50% 0%,#221a18,#120e0d 60%) fixed,#120e0d}
#app{min-height:100dvh}
button{transition:filter .12s,transform .08s}
button:active:not(:disabled){transform:translateY(1px);filter:brightness(1.15)}
#top{gap:6px}
#menuBtn,#mapBtn,#hpBox,#relBtn{background:var(--panel-g);border:1px solid var(--edge);box-shadow:var(--hi),var(--drop);border-radius:5px;height:32px;box-sizing:border-box}
#mapBtn{font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:.02em;padding:0 11px}
#hpBox{padding:0 10px}#hpBox b{font-size:18px;font-family:var(--display);font-weight:400}
#hpBox .heart{width:13px;height:13px;filter:drop-shadow(0 0 4px rgba(220,70,60,.6))}
#relBtn{display:flex;align-items:center;gap:1px;padding:0 6px;color:var(--gold);font-size:11px}
#relBtn .itm.xs{width:18px;height:18px;border-width:1px}#relBtn b{margin-left:3px}
#roundLbl{font-size:17px;text-shadow:0 1px 0 #000}
.pip{height:5px;border-radius:2px;background:#2e2624;box-shadow:inset 0 1px 0 rgba(0,0,0,.4)}
.pip.done{background:#6a5434}.pip.cur{background:var(--gold);box-shadow:0 0 6px rgba(216,171,76,.7)}
/* trait badges */
.tb{background:var(--panel-g);box-shadow:var(--hi);height:32px;box-sizing:border-box;border-radius:5px}
/* stage frame */
#stage{border:0;box-shadow:0 -1px 0 #3a2e2a,0 1px 0 #3a2e2a,0 8px 18px rgba(0,0,0,.5) inset}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,220,170,.05)}
#toast{background:linear-gradient(180deg,rgba(30,22,20,.94),rgba(18,13,12,.94));border:1px solid #5a4632;box-shadow:0 4px 14px rgba(0,0,0,.55);padding:6px 14px;border-radius:6px}
#toast b{font-family:var(--display);font-weight:400;font-size:15px;color:#f0dcb0}
/* bench */
.slot{background:linear-gradient(180deg,#221c1b,#181413);border:1px solid #2e2624;border-radius:4px;box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
.slot.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 10px rgba(216,171,76,.4)}
.slot.drop{border-color:#6a5434;border-style:dashed}
#armory .alab{font-family:var(--display);text-transform:none;letter-spacing:.02em;font-size:13px;color:#b8a890;font-weight:400}
.abook{background:var(--panel-g);box-shadow:var(--hi)}
/* economy */
#fight{background:var(--ember);border:1px solid #d0703a;box-shadow:inset 0 1px 0 rgba(255,200,150,.3),0 0 0 1px #3a1408,0 4px 14px rgba(160,60,20,.35);border-radius:6px;font-size:19px;text-shadow:0 1px 0 #3a1006;padding:9px 18px}
#fight:not(:disabled){animation:fglow 2.6s ease-in-out infinite}
@keyframes fglow{50%{box-shadow:inset 0 1px 0 rgba(255,200,150,.3),0 0 0 1px #3a1408,0 4px 22px rgba(220,90,30,.55)}}
#xpbar{height:6px;background:#1a1414;box-shadow:inset 0 1px 2px #000}#xpbar i{background:linear-gradient(90deg,#4a7ac0,#8ac0f0)}
#goldBox .gtop{font-family:var(--display);font-weight:400;font-size:24px;color:#f0c870;text-shadow:0 1px 0 #3a2408}
.coin{background:radial-gradient(circle at 35% 30%,#fff0b0,#e0b040 45%,#8a5a18 80%)}
/* shop buttons */
.sbtn{background:var(--panel-g);border:1px solid var(--edge);box-shadow:var(--hi),var(--drop);border-radius:5px;font-size:13px}
.sbtn.lockb{flex:.62;flex-direction:row;gap:4px;font-size:11px;color:var(--muted)}
.sbtn.lockb.on{border-color:var(--gold);color:var(--gold);background:linear-gradient(180deg,#3a2f22,#2a2218)}
#shopRow.sellzone #selbar{display:none}
#stage.bossfight #toast{top:46px}
.card .cst2{position:absolute;top:3px;right:3px;z-index:2;display:flex;align-items:center;gap:2px;background:#100c0be0;border-radius:8px;padding:1px 5px 1px 2px;font-family:var(--display);font-size:12px;color:#f0c870;box-shadow:0 0 0 1px color-mix(in srgb,var(--kc) 70%,#000)}
.card .cst2 .coin{width:10px;height:10px}
.card .foot{justify-content:center}.card .foot .nm{text-align:center}
#shopRow.sellzone::after{content:attr(data-sell);position:absolute;inset:-2px;z-index:6;display:grid;place-items:center;background:repeating-linear-gradient(135deg,rgba(90,28,20,.97) 0 10px,rgba(70,20,14,.97) 10px 20px);border:2px dashed #e0704e;border-radius:8px;font-family:var(--display);font-size:18px;color:#ffd8c0;text-shadow:0 1px 0 #000}
#ghost{position:fixed;left:0;top:0;width:64px;height:76px;pointer-events:none;z-index:40;filter:drop-shadow(0 10px 8px rgba(0,0,0,.6)) drop-shadow(0 0 6px rgba(216,171,76,.5))}
#ghost .pc{width:100%;height:100%}
.slot,#cv{touch-action:none}

#shop{gap:5px}

.card{container-type:inline-size}

.card .foot{height:24px;background:linear-gradient(180deg,rgba(16,12,11,.2),#100c0b 40%);padding:0 4px 0 5px;align-items:flex-end;padding-bottom:4px;box-sizing:border-box}

.card.k1{border-color:#6a6560}.card.k2{border-color:#4a9a4a}.card.k3{border-color:#3a7ad0}.card.k4{border-color:#a04ad0}.card.k5{border-color:#e0a838}
.card::after{content:"";position:absolute;inset:0;border-radius:5px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 -30px 30px -24px color-mix(in srgb,var(--kc) 40%,transparent)}
.card.empty{background:repeating-linear-gradient(135deg,#171312 0 6px,#1a1615 6px 12px);opacity:.5}

// ---- pixel-art item icons: each item is drawn on a 24px canvas, then pixelized like the sprites ----
function iconPen(x){
  x.lineJoin='round';x.lineCap='round';
  const fill=c=>{x.fillStyle=c;x.fill()};
  const g={
    poly(c,pts){x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();fill(c)},
    circ(cx,cy,r,c){x.beginPath();x.arc(cx,cy,r,0,7);fill(c)},
    ell(cx,cy,rx,ry,c,rot=0){x.beginPath();x.ellipse(cx,cy,rx,ry,rot,0,7);fill(c)},
    rect(a,b,w,h,c){x.fillStyle=c;x.fillRect(a,b,w,h)},
    bar(x1,y1,x2,y2,w,c){x.strokeStyle=c;x.lineWidth=w;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke()},
    curve(c,w,a,b,cx,cy,d,e){x.strokeStyle=c;x.lineWidth=w;x.beginPath();x.moveTo(a,b);x.quadraticCurveTo(cx,cy,d,e);x.stroke()},
    ring(cx,cy,r,w,c,a0=0,a1=7){x.strokeStyle=c;x.lineWidth=w;x.beginPath();x.arc(cx,cy,r,a0,a1);x.stroke()},
    px(a,b,c,s=1){x.fillStyle=c;x.fillRect(a,b,s,s)},
    blade(x1,y1,x2,y2,w,c){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,qx=-uy*w/2,qy=ux*w/2;
      g.poly(c,[[x1+qx,y1+qy],[x2+qx,y2+qy],[x2+ux*w*1.1,y2+uy*w*1.1],[x2-qx,y2-qy],[x1-qx,y1-qy]]);
      g.bar(x1+ux,y1+uy,x2-ux,y2-uy,.8,'rgba(255,255,255,.55)')},
    flame(cx,cy,s){g.poly('#ff5a1e',[[cx-3*s,cy],[cx-2*s,cy-3.5*s],[cx-.6*s,cy-2*s],[cx+.2*s,cy-6*s],[cx+1.8*s,cy-2.6*s],[cx+3*s,cy-4*s],[cx+3*s,cy]]);
      g.poly('#ffd060',[[cx-1.5*s,cy],[cx-.5*s,cy-2.4*s],[cx+.4*s,cy-1.4*s],[cx+1.2*s,cy-3*s],[cx+1.6*s,cy]])},
    hilt(x0,y0,ux,uy,guard,grip){g.bar(x0-ux*4,y0-uy*4,x0,y0,2.6,grip||'#4a2e1c');g.bar(x0-uy*3.4,y0+ux*3.4,x0+uy*3.4,y0-ux*3.4,2.2,guard||'#c8a04a');g.circ(x0-ux*4.8,y0-uy*4.8,1.6,guard||'#c8a04a')},
    sword(c,opt={}){const x1=8.5,y1=15.5,x2=20.5,y2=3.5,ux=.707,uy=-.707;g.blade(x1,y1,x2,y2,opt.w||3.4,c);g.hilt(x1,y1,ux,uy,opt.guard,opt.grip)},
  };
  return g;
}

const ICON_CACHE={};
function iconArt(id){
  if(ICON_CACHE[id])return ICON_CACHE[id];
  const N=26,cv=document.createElement('canvas');cv.width=cv.height=N;
  const x=cv.getContext('2d',{willReadFrequently:true});x.translate(1,1);
  (ICONS[id]||ICONS.blade)(iconPen(x));
  x.setTransform(1,0,0,1,0,0);const img=x.getImageData(0,0,N,N);pixelize(img,{ol:[22,12,8],step:12,dither:.35,pop:1,th:100});x.putImageData(img,0,0);
  return ICON_CACHE[id]={cv,url:cv.toDataURL()};
}

const ROWS=5,rowLen=r=>r%2?8:9;
const Xof=(r,c)=>c+(r%2?.5:0);
const side=(r,c)=>{const x=Xof(r,c);return x<=3.5?'A':x>=4.5?'B':'N'};

const MOODS={ashen:{root:55,scale:[0,1,3,5,7,8,10]},pact:{root:49,scale:[0,2,3,5,7,8,10]},hollows:{root:41.2,scale:[0,2,3,5,7,8,11]},spires:{root:73.4,scale:[0,2,3,6,7,9,10]},drowned:{root:61.7,scale:[0,1,3,5,7,8,10]},

function musicStart(){

  const master=a.createGain();master.gain.value=0;master.connect(a.destination);master.gain.linearRampToValueAtTime(.06*SET.vol,a.currentTime+4);
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;lp.Q.value=4;lp.connect(master);

function musicTick(){const n=MUS.nodes;if(!n)return;const a=SFX.ctx;if(!a||a.state!=='running')return;const t=a.currentTime;MUS.beat++;
  const M=MOODS[MUS.mood],note=k=>M.root*4*Math.pow(2,(M.scale[k%7]+12*Math.floor(k/7))/12);
  if(MUS.combat){ // war drums: a heavy hit on the beat, ghost hits between
    if(MUS.beat%2===0){const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(40,t+.18);g.gain.setValueAtTime(MUS.beat%8===0?.9:.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(n.master);o.start(t);o.stop(t+.32)}

  if(e)return{hp:e.hp,max:e.max,mana:e.mana,maxMana:e.maxMana,atk:e.atk,as:e.effAs||e.as,ar:e.armor,mr:e.mr,range:e.range,sp:e.sp,shield:e.shield};
  return{hp:d.hp*m,max:d.hp*m,mana:0,maxMana:d.mana-(d.c==='Hexblade'?20:0),atk:d.atk*m,as:d.as,ar:d.ar+(d.c==='Vanguard'?15:0),mr:d.mr,range:d.r,sp:1,shield:0};
}

function tickSheet(){
  if(!sheet||!sheet.ent)return;
  const st=unitStats(sheet),hp=$('#shHp'),mp=$('#shMp');if(!hp)return;
  hp.querySelector('i').style.width=(100*clamp01(st.hp/st.max))+'%';

  if(UNITS[sheet.key].ab)mp.querySelector('span').textContent=`${Math.round(st.mana)} / ${st.maxMana}`;

function applyItems(e){
  let atkP=0,asP=0,spP=0;
  for(const id of e.items){for(const c of compsOf(id)){const st=COMP[c].stat;atkP+=st.atkP||0;asP+=st.asP||0;spP+=st.sp||0;e.armor+=st.ar||0;e.mr+=st.mr||0;e.hp+=st.hp||0;e.regen=(e.regen||0)+(st.regen||0)}if(!isComp(id))e.it[id]=true}
  e.atk*=1+atkP;e.as*=1+asP;e.sp*=1+spP;const I=e.it;if(I.grimoire)e.sp*=1.4;
  if(I.headsman)e.atk*=1.3;if(I.quiver)e.as*=1.3;if(I.bulwark){e.armor+=40;e.dr=.88}if(I.veil){e.mr+=40;e.stoneImmune=true}
  if(I.hollow)e.maxMana=Math.round(e.maxMana*.75);if(I.ashcrown)e.crown=true;

function applyTraits(ents,cnt){

    const o=e.o,c=e.cls;
    if(o.includes('Ashborn')){const t=T('Ashborn');if(t>=1)e.hp*=1.15;if(t>=2)e.revive=true;if(t>=3)e.reviveBurst=true}
    if(o.includes('Ironpact')){const t=T('Ironpact');if(t>=1)e.armor+=20;if(t>=2)e.share=true;if(t>=3)e.oath=true}
    if(o.includes('Stoneblood')){const t=T('Stoneblood');if(t>=1)e.hp*=1.25;if(t>=2)e.stoner=true;if(t>=3)e.stoneImmune=true}
    if(o.includes('Hollow')){const t=T('Hollow');if(t>=1)e.maxMana=Math.max(20,e.maxMana-20);if(t>=2)e.hollowKill=30;if(t>=3)e.hollowEcho=true}
    if(o.includes('Wraithkin')){const t=T('Wraithkin');if(t>=1)e.dodge=.2;if(t>=2)e.counter=true;if(t>=3)e.fade=true}

    if(o.includes('Plagueborn')){const t=T('Plagueborn');if(t>=1)e.rotter=1;if(t>=2)e.rotSpread=true;if(t>=3){e.rotLong=true;e.stoneImmune=true;e.slowImmune=true;e.burnImmune=true}}
    if(o.includes('Verdant')){const t=T('Verdant');if(t>=1)e.vregen=.02;if(t>=2){e.hp*=1.2;e.vregen=.04}if(t>=3)e.thorns=true}
    if(o.includes('Covenant')){const t=T('Covenant');if(t>=1){e.hp*=1.15;e.atk*=1.15;e.armor*=1.15;e.mr*=1.15}if(t>=2)e.abilRes=.5;if(t>=3)e.lastStand=true}
    if(o.includes('Forsaken')){const t=T('Forsaken');if(t>=1)e.fsk={rate:t>=2?.16:.08,n:0};if(t>=2)e.hp*=1.2;if(t>=3)e.fskLast=true}
    e.sp*=inv;
    if(c==='Vanguard'){const add=[0,25,60,60][T('Vanguard')];e.armor+=add;e.mr+=add}
    if(vg3){e.armor+=25;e.mr+=25}
    if(c==='Ravager'){e.as*=[1,1.25,1.5,1.85][T('Ravager')];e.killHeal=[0,0,.25,.5][T('Ravager')]}
    {const t=T('Sentinel');if(e.range>1&&t>=1){e.as*=[1,1.15,1.35,1.6][t];if(t>=2)e.range+=1}if(c==='Sentinel'){e.marker=true;e.twin=t>=3}}
    if(c==='Breaker'){const t=T('Breaker');e.shred=[5,8,12,18][t];e.mrShred=[0,0,6,12][t]}
    if(c==='Warden'){e.healPct=[.04,.07,.1,.14][T('Warden')];e.healR=T('Warden')>=3?2:1}
    if(c==='Specter'){const t=T('Specter');e.atk*=[1,1.25,1.5,1.85][t];if(t>=2)e.critC=.3;e.execute=t>=3}
    if(c==='Hexblade'){e.hexMana=[0,5,10,15][T('Hexblade')];e.hexVamp=T('Hexblade')>=3}
  }
}
function startCombat(){
  if(S.phase!=='plan')return;
  if(!boardCount())return toast('Your field is empty','Move a unit from the bench onto your side.');
  sel=null;selItem=null;closeSheet();S.phase='combat';
  const lateScale=(1+Math.max(0,diff()-8)*.07)*(1+.07*RUN.scale)*(1+.06*(S.heat||0));MUS.combat=true;
  const A=Object.entries(S.board).map(([k,u])=>{const [r,c]=k.split(',').map(Number);return makeEnt(u,'A',r,c,1)});
  const B=S.enemy.map(u=>makeEnt(u,'B',u.r,u.c,u.boss?1:lateScale));
  applyTraits(A,traitCounts(Object.values(S.board),true));applyTraits(B,traitCounts(S.enemy));
  if(has('fragment'))A.forEach(e=>e.sp*=1.1);
  if(has('ironwill'))A.forEach(e=>{if(e.cls==='Vanguard'||e.cls==='Sentinel')e.armor+=30});
  if(has('hollowcore'))A.forEach(e=>e.maxMana=Math.max(20,e.maxMana-15));
  if(has('whetstone'))A.forEach(e=>e.atk*=1.1);
  if(has('plaguevial'))A.forEach(e=>e.rotter=Math.max(e.rotter||0,1));
  if(has('wraithcloak'))A.forEach(e=>e.cloak=true);
  if(has('verdantseed'))A.forEach(e=>e.vregen=(e.vregen||0)+.01);
  if(has('warhorn'))A.forEach(e=>e.horn=true);
  if(has('writ'))A.forEach(e=>e.writ=true);
  A.forEach(e=>{const o=e.o;
    if(has('oathring')&&o.includes('Ironpact'))e.as*=1.2;
    if(has('banner')&&o.includes('Covenant')){e.armor+=20;e.mr+=20}
    if(has('scarf')&&e.fsk){e.fsk.n=1;e.armor+=8}
    if(has('chorus')&&o.includes('Hollow'))e.regen=(e.regen||0)+4;
    if(has('gravebell')&&o.includes('Wraithkin'))e.dodge=(e.dodge||0)+.12;
    if(has('pestmask'))e.pest=true;
    if(has('emberheart')&&e.revive)e.revFrac=.6;
    if(has('geode')&&o.includes('Stoneblood'))e.geode=true});
  if((S.heat||0)>=4)B.forEach(e=>e.as*=1.15);
  if((S.heat||0)>=5)B.forEach(e=>{if(e.boss&&e.boss!=='mini')e.hp*=1.25});
  B.forEach(e=>{if(e.boss==='duskmother')e.ls=.3;if(e.boss==='kingboss'){e.burnOnHit=true;e.phase=0}if(e.boss==='sovereign'){e.rotter=2;B.forEach(b=>{if(b!==e)b.rotBomb=true})}});
  if(has('crown')){const occ=new Set(A.map(e=>K(e.r,e.c)));
    const free=ALLCELLS.filter(p=>side(p.r,p.c)==='A'&&!occ.has(K(p.r,p.c))).sort((a,b)=>Xof(b.r,b.c)-Xof(a.r,a.c))[0];
    if(free)A.push(makeEnt({key:'revenant',star:1},'A',free.r,free.c,1))}
  const ents=[...A,...B];ents.forEach(applyItems);ents.forEach(e=>{e.max=e.hp;e.mana=Math.min(e.mana,e.maxMana-1);if(e.it.ward)e.shield+=e.max*.3;if(e.geode)e.shield+=e.max*.2});
  C={ents,grid:new Map(ents.map(e=>[K(e.r,e.c),e])),time:0,acc:0,speed:C?C.speed:SET.speed,over:false,after:0,ended:false,pend:[],proj:[],fx:[],badgeUsed:false,flashT:null};
  $('#stage').classList.toggle('bossfight',B.some(e=>e.boss));render();toast('Battle','Tap any unit to inspect it.');
}

function fxText(e,txt,col,size,pill){const d=disp(e);if(C.time-(e._tt||-9)<.35)e._tn=((e._tn||0)+1)%4;else e._tn=0;e._tt=C.time;

function shoot(src,t,amt,type,big,onHit,crit){
  const w=LOOK[src.key].wpn;

  const colr=kind==='orb'?(LOOK[src.key].orb||'#ffc070'):(big?src.oc:'#a89880');
  C.proj.push({src,t,amt,type,big,onHit,crit,kind,col:w==='censer'?'#ffd090':w==='tome'?'#ff8a3a':colr,fr:src.pr,fX:src.pX,t0:C.time+.16,dur:.14+.07*dist(src,t)});

function addRot(src,t,n){if(!t||t.dead)return;const r=t.rot||(t.rot={n:0,until:0,src:null});r.n=Math.min(10,r.n+n);r.until=C.time+(src&&src.rotLong?8:4);r.src=src;if(src&&src.rotSpread)t.rotSpread=true}

function pickTarget(e){
  const foes=alive(foeOf(e.team));if(!foes.length)return null;
  if(e.cls==='Specter')return foes.reduce((a,b)=>b.hp<a.hp?b:a);
  let bestD=99,t=null;
  for(const f of shuffle(foes)){const d=dist(e,f)-(f.cls==='Vanguard'?1:0);if(d<bestD){bestD=d;t=f}}
  return t;

// Breadth-first search over free hexes to the nearest hex within attack range of t. Returns the first step, or null if no route exists.
function routeStep(e,t){
  const start=K(e.r,e.c),prev=new Map([[start,null]]),q=[{r:e.r,c:e.c}];
  let goal=null;
  for(let i=0;i<q.length;i++){
    const p=q[i];
    if(i>0&&dist(p,t)<=e.range){goal=p;break}
    for(const n of shuffle(neighbors(p.r,p.c))){const k=K(n.r,n.c);if(prev.has(k)||C.grid.has(k))continue;prev.set(k,K(p.r,p.c));q.push(n)}
  }
  if(!goal)return null;
  let k=K(goal.r,goal.c);while(prev.get(k)!==start)k=prev.get(k);
  const [r,c]=k.split(',').map(Number);return{r,c};
}
function step(dt){
  C.time+=dt;const tm=C.time;
  C.pend=C.pend.filter(h=>{if(h.at<=tm){h.fn();return false}return true});
  C.proj=C.proj.filter(p=>{if(p.t0+p.dur<=tm){
    let t=p.t,red=1;
    hit(p.src,t,p.amt*red,p.type,!p.big,p.crit);if(p.onHit&&t&&!t.dead)p.onHit(t);return false}return true});
  C.fx=C.fx.filter(f=>tm-f.t0<f.dur);
  for(const e of C.ents){
    if(e.dead)continue;
    if(!e.landed&&tm>e.spawnT+.22){e.landed=true;fxAt('dust',e,.35);if(throttle('land',120))tone(90,.06,'sine',.03,.6)}

function rollDrops(won,node){
  if(C.drops)return C.drops;
  // Items are scarce: normal wins drop a component about one time in three (never more than three dry wins in a row),
  // elites always drop one, mini bosses drop a single finished item, and losses drop nothing.
  const d=[];
  if(won){
    if(node==='boss')d.push(rnd(FULL_KEYS));
    else if(node==='elite'){d.push(rnd(Object.keys(COMP)));S.dry=0}
    else if(node!=='final'){S.dry=(S.dry||0)+1;if(Math.random()<.3||S.dry>=4){d.push(rnd(Object.keys(COMP)));S.dry=0}}
  }
  return C.drops=d;
}

function genMap(final){
  const L=10,layers=[];let id=0;
  const pool=[['battle'],['battle','battle','event'],['battle','shop','event','forge'],['battle','battle','event','camp'],['elite','battle','event'],['battle','shop','camp','forge'],['battle','event','battle'],['elite','battle','shop','event'],['battle','event','camp','forge'],['camp','shop','battle']];
  for(let l=0;l<L;l++){const n=l===0?2:(Math.random()<.55?3:2),layer=[];
    for(let i=0;i<n;i++){const x=(i+.5)/n+(Math.random()-.5)*.12;layer.push({id:id++,l,i,n,x:Math.max(.08,Math.min(.92,x)),type:rnd(pool[l]),next:[]})}
    layers.push(layer)}
  if(!layers.slice(2).flat().some(n=>n.type==='shop'))rnd(layers[5]).type='shop';
  for(let l=0;l<L-1;l++){const A=layers[l],B=layers[l+1];
    A.forEach(a=>{B.forEach(b=>{if(Math.abs(a.x-b.x)<.36)a.next.push(b.id)});if(!a.next.length)a.next.push(B.reduce((p,b)=>Math.abs(b.x-a.x)<Math.abs(p.x-a.x)?b:p).id)});
    B.forEach(b=>{if(!A.some(a=>a.next.includes(b.id)))A.reduce((p,a)=>Math.abs(a.x-b.x)<Math.abs(p.x-b.x)?a:p).next.push(b.id)});
  }
  const boss={id:id++,l:L,i:0,n:1,x:.5,type:final?'final':'boss',next:[]};
  layers[L-1].forEach(a=>a.next.push(boss.id));
  return{layers,boss};
}

function frame(ts){

    else if(!C.over){C.acc+=dt*C.speed;while(C.acc>=.05&&!C.over){step(.05);C.acc-=.05}}
    else{C.time+=dt*C.speed;C.after+=dt;
      const due=C.pend.filter(h=>h.at<=C.time);C.pend=C.pend.filter(h=>h.at>C.time);due.forEach(h=>h.fn());
      if(!C.banner){C.banner=true;showBanner()}
      if(C.after>2.8&&!C.ended){C.ended=true;endCombat()}}

    if(x>P.x-w&&x<P.x+w&&y>P.y-h&&y<P.y+4){const d=Math.abs(x-P.x)+Math.abs(y-(P.y-h/2))*.5-u.r*2;if(d<hd){hd=d;hitU=u}}}

  if(t.closest('[data-leave]'))return afterNode();
  const sm=t.closest('[data-smith]');if(sm){const c=sm.dataset.smith;S.items.push(c);sfx.buy();return afterNode(`${COMP[c].name} taken`,'Added to your armory.')}
  const smi=t.closest('[data-smithitem]');if(smi&&!smi.disabled){const o=S.offer.item;if(S.gold>=o.price){S.gold-=o.price;S.items.push(o.id);sfx.merge();return afterNode(`${ITEM[o.id].name} bought`,'Added to your armory.')}return}
  if(t.closest('[data-recipes]')){sheet={type:'recipes'};return renderSheet()}
  if(t.closest('#relBtn')){sel=null;sheet={type:'relics'};return renderSheet()}
  const ii=t.closest('[data-iteminfo]');if(ii)return openItem(ii.dataset.iteminfo);
  const it=t.closest('[data-item]');if(it){if(S.phase!=='plan')return toast('Items are equipped between battles','');const i=+it.dataset.item;selItem=selItem===i?null:i;sel=null;closeSheet();sfx.tap();return render()}
  const evb=t.closest('[data-ev]');if(evb&&!evb.disabled){const E=EVENTS[S.ev],ch=E[evb.dataset.ev];const res=ch[3]();render();return afterNode(ch[0],typeof res==='string'?res:ch[1])}
  const cp=t.closest('[data-camp]');if(cp&&!cp.disabled){if(cp.dataset.camp==='rest'){heal(8);return afterNode('Rested','+8 health')}S.xp+=6;checkLevel();return afterNode('Drilled','+6 XP')}
  if(t.id==='again'){closeModal();newRun();return contractModal()}
  if(t.closest('#reroll'))return reroll();
  if(t.closest('#lockBtn'))return toggleLock();
  if(t.closest('#buyxp'))return buyXp();
  if(t.closest('#fight')){
    if(S.phase==='plan')return startCombat();
    if(S.phase==='combat'&&C){C.speed=C.speed===1?2:C.speed===2?4:1;SET.speed=C.speed;saveSet();$('#fight').textContent=`Speed ${C.speed}x`}
  }
});
// Fit the whole game to the visible screen: stage and card sizes adapt, then any leftover overflow is trimmed off the sky.
function fitOverflow(){return Math.ceil(document.documentElement.scrollHeight-(window.visualViewport?window.visualViewport.height:window.innerHeight))}
function refit(){V.trim=0;layout();if(S)render();
  for(let i=0;i<3;i++){const over=fitOverflow();if(over<=1)break;V.trim+=over+2;layout();if(S)render()}}
let refitT=0;const queueRefit=()=>{clearTimeout(refitT);refitT=setTimeout(refit,120)};
window.addEventListener('resize',queueRefit);
if(window.visualViewport)window.visualViewport.addEventListener('resize',queueRefit);
window.addEventListener('orientationchange',queueRefit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S)queueRefit()});
document.addEventListener('keydown',ev=>{if(!S||V.menuMode||!$('#overlay').hidden||ev.metaKey||ev.ctrlKey)return;const k=ev.key.toLowerCase();
  if(k==='d')reroll();else if(k==='f')buyXp();else if(k==='l'&&S.phase==='plan')toggleLock();else if(k===' '||k==='enter'){if(S.phase==='plan'){ev.preventDefault();startCombat()}}
  else if(k==='m')showMap(S.phase!=='map');else if(k==='escape'){closeSheet();sel=null;selItem=null;render()}
  else if(/^[1-5]$/.test(k)&&S.phase==='plan')buy(+k-1)});

function resumeRun(){
  setRun(S.run||0);
  if(S.phase==='combat')S.phase='plan';
  render();
  if(S.phase==='map'){S.map?showMap():regionChoice()}
  else if(S.phase==='event'){if(S.node==='shop')merchant();else if(S.node==='event')crisis(true);else if(S.node==='forge')smithy();else camp()}
  else toast('Welcome back',`Act ${S.act}${S.region?' · '+REGIONS[S.region].name:''}`);
}
function start(data){
  layout();
  if(data&&data.S&&data.S.v===S_VERSION&&data.S.relics&&data.S.relics.length){S=data.S;resumeRun()}
  else{newRun();clearRunIfStale();openMenu(false)}
  requestAnimationFrame(frame);
}
function clearRunIfStale(){const d=store.get(SAVE_KEY,null);if(d&&(!d.S||d.S.v!==S_VERSION))clearRun()}
window.claude?.hot?.snapshot?.(()=>({S:S&&S.phase!=='combat'?S:null}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!/\/versions\//.test(location.pathname))navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
